name: Windows CI

# Builds, tests and packages the Windows port only. The macOS workflows
# (ci.yml, release-candidate.yml) are untouched and keep their own triggers.
#
# The job is deliberately NOT called `build-and-test`: that context name is the
# required status check for the macOS build on `main`, and a second job sharing
# it would make the protected check ambiguous.
on:
  push:
    # Working branches are included so the Windows-only tests (Job Object
    # containment, process-tree teardown) actually run before the work reaches
    # `main`. GitHub only offers workflow_dispatch for workflow files already on
    # the default branch, so the push trigger is what exercises a new branch.
    branches:
      - main
      - 'agent/**'
    paths:
      - 'windows/**'
      - 'shared/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'shared/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    # Every dotnet command runs from `windows/` so that windows/global.json is
    # the SDK the CLI resolves. Without it the muxer silently picks the newest
    # SDK on the runner, which is not the one this workflow installs.
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # Fails the run if anything other than .NET 8 is in effect, so a silent
      # SDK drift can never be discovered only after shipping.
      - name: Verify the SDK in use is .NET 8
        run: |
          $sdk = dotnet --version
          Write-Host "dotnet --version: $sdk"
          dotnet --list-sdks
          if (-not $sdk.StartsWith('8.')) {
            Write-Host "::error::Expected the .NET 8 SDK, resolved $sdk"
            exit 1
          }

      # For a pull request GitHub checks out refs/pull/N/merge — a synthetic
      # merge commit created for this run and discarded afterwards. Stamping
      # artifacts from `git rev-parse HEAD` therefore names a commit nobody can
      # look up, which is how UsageBar 2.0.0 shipped as `2.0.0+14bea7e`. The
      # authoritative revision comes from the event instead, is validated as a
      # full 40-character SHA before anything uses it, and is then passed
      # explicitly to every step that builds, packages or verifies binaries.
      #
      # The values arrive through env rather than being interpolated into the
      # script body, so nothing in the payload can be evaluated as code.
      - name: Resolve the source revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $origin = 'pull-request head'
            $revision = $env:PULL_REQUEST_HEAD_SHA
          }
          else {
            $origin = "$($env:EVENT_NAME) SHA"
            $revision = $env:EVENT_SHA
          }

          if ($revision -notmatch '^[0-9a-fA-F]{40}$') {
            Write-Host "::error::The resolved source revision is not a full 40-character commit SHA."
            exit 1
          }

          $revision = $revision.ToLowerInvariant()
          $buildId = $revision.Substring(0, 7)

          Write-Host "Source of revision   : $origin"
          Write-Host "Resolved revision    : $revision"
          Write-Host "Expected build id    : $buildId"
          # Printed for contrast: on a pull request this is the merge ref, and
          # it is deliberately not what the artifacts are stamped with.
          Write-Host "Checked-out git HEAD : $(git rev-parse HEAD)"

          "USAGEBAR_SOURCE_REVISION=$revision" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "USAGEBAR_BUILD_ID=$buildId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build-id=$buildId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Proves the resolution rules themselves: acceptance, rejection, the
      # seven-character build id and the local fallback.
      - name: Source revision tests
        run: ./scripts/test-source-revision.ps1

      - name: Restore
        run: dotnet restore UsageBar.Windows.sln

      # Stamped with the resolved revision so the assemblies the tests run
      # against report the same build id the packaged ones will.
      - name: Build (Release)
        run: >
          dotnet build UsageBar.Windows.sln
          --configuration Release
          --no-restore
          -p:SourceRevisionId=$env:USAGEBAR_BUILD_ID

      # The Windows-only tests (Job Object containment, process-tree teardown,
      # CreateProcessW argument round-trips, executable ACL validation, registry
      # auto-start) can only run here. Elsewhere they report as skipped, never
      # as passed.
      # No fixed LogFileName: the solution has two test projects, and a shared
      # name meant the second overwrote the first, so the uploaded results only
      # ever showed one assembly. The default name is per-assembly.
      - name: Test (Release)
        run: >
          dotnet test UsageBar.Windows.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory artifacts/test-results

      # -SkipTests because the step above just ran the whole suite against this
      # exact tree; the script still does its own publish, staging and hashing.
      # -SourceRevision so the publish stamps the real commit rather than the
      # merge ref its own `git rev-parse HEAD` fallback would find here.
      - name: Package (portable ZIP)
        run: ./scripts/package.ps1 -SkipTests -SourceRevision $env:USAGEBAR_SOURCE_REVISION

      # Refuses to publish an archive that ships symbols, test assets, source,
      # macOS output, leaked paths, a console-subsystem binary or a manifest
      # asking for administrator rights — or that was stamped with a revision
      # other than the one resolved above.
      - name: Verify the package
        run: ./scripts/verify-package.ps1 -ExpectedSourceRevision $env:USAGEBAR_SOURCE_REVISION

      # Compiled from the same staging directory the portable package was
      # verified from, so the installed and portable builds cannot drift. A
      # deliberately older build is produced too, purely so the upgrade smoke
      # test upgrades from something rather than reinstalling identical bytes.
      - name: Package (installer)
        run: ./scripts/package-installer.ps1

      - name: Package (previous version, for the upgrade test)
        run: ./scripts/package-installer.ps1 -VersionOverride 0.0.1 -OutputBaseName UsageBar-Setup-x64-previous

      # The payload is the staging directory the portable package was verified
      # from, so it must report the very same revision.
      - name: Verify the installer
        run: ./scripts/verify-installer.ps1 -ExpectedSourceRevision $env:USAGEBAR_SOURCE_REVISION

      # A real install, upgrade and uninstall on this runner. All state is
      # created under temporary paths and removed afterwards.
      - name: Install / upgrade / uninstall smoke test
        run: >
          ./scripts/smoke-test-installer.ps1
          -SetupPath artifacts/UsageBar-Setup-x64.exe
          -PreviousSetupPath artifacts/UsageBar-Setup-x64-previous.exe

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UsageBar-Windows-Installer-x64
          path: |
            windows/artifacts/UsageBar-Setup-x64.exe
            windows/artifacts/UsageBar-Setup-x64.exe.sha256
          if-no-files-found: error

      - name: Upload the portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UsageBar-Windows-x64
          path: |
            windows/artifacts/UsageBar-Windows-x64.zip
            windows/artifacts/UsageBar-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-results
          path: windows/artifacts/test-results
          if-no-files-found: warn
