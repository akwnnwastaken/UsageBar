name: Release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-attest:
    # Pinned deliberately: the published archive is named `-arm64` and nothing
    # here cross-compiles, so the runner generation and the selected Xcode are
    # what a release is actually built with. `macos-latest` let all of that move
    # without a repository change. `ci.yml` runs the same environment and the
    # same guard on every push, so a toolchain problem surfaces long before a
    # tag is pushed.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require pinned macOS release toolchain
        run: ./tests/release_toolchain_guard.sh
      - name: Require a verified signed annotated tag matching Info.plist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          test "$TAG_NAME" = "v${version}"
          object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.type')"
          test "$object_type" = "tag"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')"
          test "$verified" = "true"
      - name: Build and verify from a clean checkout
        run: ./tests/security_acceptance.sh
      # The archive is published as `-arm64`; prove the payload really is,
      # before it is named, hashed and attested. The packaging gate above has
      # already run the app's self-test and `codesign --verify --deep --strict`.
      - name: Verify the release payload is arm64
        shell: bash
        run: |
          set -euo pipefail
          executable="build/UsageBar.app/Contents/MacOS/UsageBar"
          test -x "$executable"
          file "$executable"
          archs="$(lipo -archs "$executable")"
          echo "lipo -archs: $archs"
          test "$archs" = "arm64"
          codesign --verify --deep --strict build/UsageBar.app
      - name: Create archive and SHA-256 manifest
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          archive="UsageBar-${version}-macOS-arm64.zip"
          ditto -c -k --keepParent build/UsageBar.app "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Attest release candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.archive }}
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UsageBar-${{ github.ref_name }}-release-candidate
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
